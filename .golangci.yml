version: "2"
run:
  timeout: 10m
  concurrency: 1
  tests: true
linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - errcheck
    - errorlint
    - gosec
    - govet
    - ineffassign
    - nilerr
    - noctx
    - staticcheck
    - unconvert
    - unused
    - wastedassign
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      enable-all: true
  exclusions:
    generated: disable
    presets: []
    paths: []
formatters:
  enable:
    - gofmt
  exclusions:
    generated: disable
    paths: []
