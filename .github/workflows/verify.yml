name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Server consumes wool and the Service SDK through sibling
      # replace directives (../../wool, ../../service-sdk), so the
      # checkouts must mirror the workspace layout the module declares.
      - uses: actions/checkout@v4
        with:
          path: services/server
      - name: Checkout wool
        uses: actions/checkout@v4
        with:
          repository: Liapoldus/wool
          path: wool
      - name: Checkout service-sdk
        uses: actions/checkout@v4
        with:
          repository: Liapoldus/service-sdk
          path: service-sdk
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/server/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/server/package-lock.json
      - name: Go build
        run: go build ./...
        working-directory: services/server
      - name: Go vet
        run: go vet ./...
        working-directory: services/server
      - name: Go tests
        run: go test ./...
        working-directory: services/server
      - name: Verify code-owned contract exports
        run: go run ./cmd/contracts --check
        working-directory: services/server
      # The TypeScript suite drives real Caddy processes and mTLS config pulls,
      # so it is the behavioural gate and not a mock-level check.
      - name: TypeScript contract suite
        run: npm ci && npm test
        working-directory: services/server
