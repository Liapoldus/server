name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Server consumes pluginprotocol and the Plugin SDK through sibling
      # replace directives (../../pluginprotocol, ../../plugin-sdk), so the
      # checkouts must mirror the workspace layout the module declares.
      - uses: actions/checkout@v4
        with:
          path: plugins/server
      - name: Checkout pluginprotocol
        uses: actions/checkout@v4
        with:
          repository: Liapoldus/pluginprotocol
          path: pluginprotocol
      - name: Checkout plugin-sdk
        uses: actions/checkout@v4
        with:
          repository: Liapoldus/plugin-sdk
          path: plugin-sdk
      - uses: actions/setup-go@v6
        with:
          go-version-file: plugins/server/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugins/server/package-lock.json
      - name: Go build
        run: go build ./...
        working-directory: plugins/server
      - name: Go vet
        run: go vet ./...
        working-directory: plugins/server
      - name: Go tests
        run: go test ./...
        working-directory: plugins/server
      # The TypeScript suite drives real Caddy processes and mTLS config pulls,
      # so it is the behavioural gate and not a mock-level check.
      - name: TypeScript contract suite
        run: npm ci && npm test
        working-directory: plugins/server
